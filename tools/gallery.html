<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>그림 모음 (개발용)</title>
<style>body{background:#d8d0c0;margin:8px;font:12px sans-serif}canvas{image-rendering:pixelated}h3{margin:6px 0 2px}</style></head>
<body><div id="out"></div>
<script type="module">
import * as A from '../js/art.js';
import { MONSTERS } from '../js/data/monsters.js';
import { drawMonsterFrame } from '../js/sprites.js';
const out = document.getElementById('out');
function row(title, pixes, k = 3, bg = null) {
  const h = document.createElement('h3'); h.textContent = title; out.appendChild(h);
  const W = pixes.reduce((s, p) => s + p.w + 2, 0), H = Math.max(...pixes.map(p => p.h));
  const c = document.createElement('canvas'); c.width = W * k; c.height = H * k; out.appendChild(c);
  const x = c.getContext('2d'); x.imageSmoothingEnabled = false; if (bg) { x.fillStyle = bg; x.fillRect(0, 0, c.width, c.height); }
  let ox = 0; for (const p of pixes) { x.drawImage(p.toCanvas(), ox * k, (H - p.h) * k, p.w * k, p.h * k); ox += p.w + 2; }
}
const pepper = { skin: A.SKINS.light, hair: [138, 59, 36], style: 'messy', outfit: [200, 66, 58], kind: 'dress', hat: { c: [70, 40, 60], band: [200, 66, 58] }, staff: { orb: [255, 120, 60] } };
const boy = { skin: A.SKINS.brown, hair: [30, 24, 30], style: 'short', outfit: [90, 60, 130], kind: 'tunic', pants: [60, 50, 70], staff: { orb: [120, 200, 255] } };
for (const [n, o] of [['pepper', pepper], ['boy', boy]]) for (const d of ['down', 'left', 'right', 'up']) row(n + ' ' + d, [0, 1, 2, 3].map(f => A.human(o, d, f, 'walk')).concat([A.human(o, d, 0, 'cast'), A.human(o, d, 1, 'cast')]));
row('cats', Object.values(A.CATS).map(c => A.cat(c, 0)));
const mons = Object.values(MONSTERS);
for (let i = 0; i < mons.length; i += 12) row('monsters ' + i, mons.slice(i, i + 12).map(m => drawMonsterFrame(m, 0, 'down')), 2);
row('projectiles', ['arcane', 'fire', 'water', 'ice', 'wind', 'dark', 'light', 'wood', 'earth', 'time'].map(e => A.projectile(e, 0)).concat([A.projectile('wind', 0, 'storm'), A.projectile('x', 0, 'arrow')]), 4, '#222');
row('bursts', ['fire', 'water', 'ice', 'wind', 'dark', 'light', 'wood', 'earth', 'time'].map(e => A.burst(e, 32, 2)), 3, '#222');
for (const t of Object.keys(A.THEMES)) row('tiles ' + t, [A.tile(t, 'g', 0), A.tile(t, 'g', 1), A.tile(t, 'path'), A.tile(t, 'water'), A.tile(t, 'wall'), A.tile(t, 'floor'), A.prop(t, 'tree'), A.prop(t, 'rock'), A.prop(t, 'bush')], 3);
row('icons', ['staff', 'hat', 'robe', 'shoes', 'ring', 'amulet', 'potion', 'scroll', 'gem'].map(s => A.icon(s, [200, 80, 200])), 4);
row('houses', [A.house([168, 67, 47], [217, 160, 102], 'staff'), A.house([80, 120, 70], [228, 200, 160], 'cloth'), A.house([70, 80, 160], [0, 0, 0], 'tower')], 2);
document.title = 'ready';
</script></body></html>
